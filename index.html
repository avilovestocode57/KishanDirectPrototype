<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KisanDirect</title>
    
    <!-- Google Fonts & Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    
    <!-- Tailwind CDN with Stitch Config -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-primary-fixed-variant": "#005315",
              "outline": "#899485",
              "on-primary-container": "#005215",
              "on-primary-fixed": "#002204",
              "on-secondary": "#3c2f00",
              "on-tertiary": "#173537",
              "surface-tint": "#7bdc7b",
              "on-primary": "#00390c",
              "surface-container-highest": "#283642",
              "surface-bright": "#2d3b47",
              "surface-variant": "#283642",
              "tertiary-container": "#9bbabc",
              "on-surface": "#d5e4f4",
              "secondary-fixed": "#ffe086",
              "on-tertiary-fixed-variant": "#2e4c4e",
              "surface": "#061520",
              "surface-container-low": "#0e1d28",
              "tertiary": "#b6d6d8",
              "secondary-container": "#cfa700",
              "surface-container-lowest": "#020f1a",
              "secondary-fixed-dim": "#edc22b",
              "error": "#ffb4ab",
              "primary-fixed-dim": "#7bdc7b",
              "on-secondary-container": "#4e3e00",
              "on-error-container": "#ffdad6",
              "on-tertiary-fixed": "#002022",
              "primary-container": "#69c96b",
              "primary-fixed": "#96f995",
              "inverse-surface": "#d5e4f4",
              "inverse-on-surface": "#24323e",
              "error-container": "#93000a",
              "outline-variant": "#3f4a3d",
              "tertiary-fixed": "#c8e9eb",
              "on-tertiary-container": "#2d4b4d",
              "on-secondary-fixed": "#231b00",
              "background": "#061520",
              "on-error": "#690005",
              "on-surface-variant": "#becab9",
              "surface-container": "#13212c",
              "primary": "#84e684",
              "inverse-primary": "#006e1f",
              "secondary": "#edc22b",
              "surface-container-high": "#1d2b37",
              "surface-dim": "#061520",
              "on-background": "#d5e4f4",
              "on-secondary-fixed-variant": "#574500",
              "tertiary-fixed-dim": "#adccce"

            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px"
            },
            spacing: {
              margin_mobile: "16px",
              gutter: "24px",
              sidebar_width: "280px",
              margin_desktop: "32px",
              stack_md: "16px",
              stack_lg: "32px",
              stack_sm: "8px"
            },
            fontFamily: {
              "label-md": ["Inter", "sans-serif"],
              "label-sm": ["Inter", "sans-serif"],
              "headline-lg-mobile": ["Inter", "sans-serif"],
              "body-lg": ["Inter", "sans-serif"],
              "display-lg": ["Inter", "sans-serif"],
              "headline-lg": ["Inter", "sans-serif"],
              "body-md": ["Inter", "sans-serif"],
              "headline-md": ["Inter", "sans-serif"]
            },
            fontSize: {
              "label-md": ["14px", { lineHeight: "20px", letterSpacing: "0.05em", fontWeight: "600" }],
              "label-sm": ["12px", { lineHeight: "16px", fontWeight: "500" }],
              "headline-lg-mobile": ["24px", { lineHeight: "32px", fontWeight: "700" }],
              "body-lg": ["18px", { lineHeight: "28px", fontWeight: "400" }],
              "display-lg": ["48px", { lineHeight: "56px", letterSpacing: "-0.02em", fontWeight: "700" }],
              "headline-lg": ["32px", { lineHeight: "40px", fontWeight: "700" }],
              "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }],
              "headline-md": ["24px", { lineHeight: "32px", fontWeight: "600" }]
            }
          }
        }
      }

  </head>
  <body class="bg-[#061520] text-[#d5e4f4] antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
